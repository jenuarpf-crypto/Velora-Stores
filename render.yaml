services:
  - type: web
    name: velora-store
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: BASE_URL
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
